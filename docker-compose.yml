name: forma-brasileira
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forma_local}
      POSTGRES_DB: forma
    ports: ["127.0.0.1:${DB_PORT:-55432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports: ["127.0.0.1:${JAEGER_PORT:-16686}:16686", "127.0.0.1:${OTLP_PORT:-4318}:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
  app:
    build: .
    ports: ["127.0.0.1:${PORT:-3000}:3000"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://forma:${POSTGRES_PASSWORD:-forma_local}@postgres:5432/forma
      REDIS_URL: redis://redis:6379
      CATALOG_CACHE_ENABLED: ${CATALOG_CACHE_ENABLED:-true}
      CATALOG_CACHE_TTL: 30
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      jaeger: {condition: service_started}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/ready').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 3s
      retries: 30
  k6:
    image: grafana/k6:1.4.2
    profiles: ["load"]
    volumes: ["./load:/scripts", "./docs/evidencias:/results"]
    environment:
      BASE_URL: http://app:3000
      ORDER_ID: 00000000-0000-4000-8000-000000000001
    entrypoint: ["k6"]
volumes:
  pgdata:

