name: forma-homolog
services:
  postgres:
    ports: !override ["127.0.0.1:5433:5432"]
  redis:
    ports: !override ["127.0.0.1:6380:6379"]
  jaeger:
    ports: !override ["127.0.0.1:16687:16686", "127.0.0.1:4319:4318"]
  app:
    ports: !override ["127.0.0.1:3001:3000"]
    environment:
      APP_ENV: homologation
