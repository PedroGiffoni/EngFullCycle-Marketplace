name: forma-benchmark
services:
  postgres:
    ports: !override ["127.0.0.1:55434:5432"]
    environment:
      POSTGRES_DB: forma_benchmark
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma_benchmark"]
  redis:
    ports: !override ["127.0.0.1:6381:6379"]
  jaeger:
    ports: !override ["127.0.0.1:16688:16686", "127.0.0.1:4320:4318"]
  app:
    ports: !override ["127.0.0.1:3002:3000"]
    environment:
      APP_ENV: benchmark
      DATABASE_URL: postgres://forma:${POSTGRES_PASSWORD:-forma_local}@postgres:5432/forma_benchmark
